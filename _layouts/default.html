<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/robert-smith.jpg' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Robert Smith</a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/talks/' | relative_url }}"{% if page.url == '/talks/' %} aria-current="page"{% endif %}>Talks</a>
        <a href="{{ site.links.github }}">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Slides are shared for reuse with attribution. Source for this site:
        <a href="https://github.com/{{ site.repository }}">{{ site.repository }}</a>.</p>
    </div>
  </footer>
  {% if page.scripts %}{% for s in page.scripts %}<script src="{{ s | relative_url }}" defer></script>{% endfor %}{% endif %}
</body>
</html>
